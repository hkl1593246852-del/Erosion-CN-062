name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Erosion IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-CN-IPA
          path: Erosion_*.ipa
